name: Feature request
description: Suggest a change or an addition.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Tintshot aims to stay small, fast, accessible, and fully client-side.
        Proposals that keep image data in the browser and avoid new
        dependencies are the easiest to accept.

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do that Tintshot makes hard today?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What should happen instead, and how would you expect to use it?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you weighed, or existing workarounds.
    validations:
      required: false
